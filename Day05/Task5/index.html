<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Responsive Webpage Layout</title>
    <style>
        /* General Reset */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            line-height: 1.6;
        }

        .Webpage {
            display: grid;
            gap: 1rem;
            padding: 1rem;
        }

        /* Default Grid Layout for Larger Screens */
        .Webpage{
            grid-template-columns: repeat(4, 1fr);
            
        }

        .Code {
            background-color: #050b56;
            color: white;
            padding: 2rem;
            text-align: center;
            border-radius: 5px;
            border: 4px solid rgb(21, 118, 112);
        }

        /* Responsive Design */
        @media (max-width: 1024px) {
            .Webpage {
                grid-template-columns: repeat(3, 1fr);
            }
        }

        @media (max-width: 580px) {
            .Webpage {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        @media (max-width: 380px) {
            .Webpage {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="Webpage">
        <div class="Code">TDC Task1</div>
        <div class="Code">TDC Task2</div>
        <div class="Code">TDC Task3</div>
        <div class="Code">TDC Task4</div>
        <div class="Code">TDC Task5</div>
        <div class="Code">TDC Task6</div>
    </div>
</body>
</html>
