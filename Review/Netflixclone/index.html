<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Netflix Clone</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="navbar">
    <div class="logo">Netflix</div>
    <nav>
      <ul class="nav-links">
        <li><a href="#">Home</a></li>
        <li><a href="#">TV Shows</a></li>
        <li><a href="#">Movies</a></li>
        <li><a href="#">My List</a></li>
      </ul>
    </nav>
    <div class="profile">
      <img src="account.png" alt="Profile">
    </div>
  </header>
  
  <section class="hero">
    <div class="overlay"></div>
    <div class="hero-content">
      <h1>Unlimited movies, TV shows and more</h1>
      <p>Starts at ₹149. Cancel at any time.</p>
      <p>Ready to watch? Enter your email to create or restart your membership.</p>
      <div class="email-form">
        <input type="email" placeholder="Email address">
        <button>Get Started</button>
      </div>
    </div>
  </section>


  <section class="content">
    <h2>Popular on Netflix</h2>
    <div class="movie-grid">
      <div class="movie-card"><img src="movie1.png" alt="Movie 1"></div>
      <div class="movie-card"><img src="movie2.png" alt="Movie 2"></div>
      <div class="movie-card"><img src="movie3.png" alt="Movie 3"></div>
      <div class="movie-card"><img src="movie4.png" alt="Movie 4"></div>
      <div class="movie-card"><img src="movie5.png" alt="Movie 5"></div>
      <div class="movie-card"><img src="movie7.png" alt="Movie 6"></div>
      <div class="movie-card"><img src="movie6.png" alt="Movie 7"></div>
    </div>
  </section>

  <footer class="footer">
    <p>&copy; 2025 Netflix Clone. All rights reserved.</p>
  </footer>
</body>
</html>
